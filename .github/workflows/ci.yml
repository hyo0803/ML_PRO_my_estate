name: ci
on: 
  push: {branches: [ main ]}
  pull_request:
  
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {enable-cache: true, python-version: '3.11'}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest